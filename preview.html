<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentic Coding AI Academy</title>
  <style>
    :root {
      --bg: #100e13;
      --card: #19161d;
      --text: #f2f1f4;
      --muted: #938f9b;
      --border: #352f3d;
      --accent: #8e48ff;
      --accent-fg: #ffffff;
      --accent-subtle: rgba(142,72,255,.16);
      --ok: #43c59e;
      --ok-subtle: rgba(67,197,158,.12);
      --danger: #f07088;
      --danger-subtle: rgba(240,112,136,.12);
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, textarea { font: inherit; }
    @media (max-width: 980px) {
      #root > div > div:last-child { grid-template-columns: 205px minmax(420px, 1fr) !important; }
      #root > div > div:last-child > aside:last-child { display: none !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createElement } from 'react'
    import { createRoot } from 'react-dom/client'
    import AcademyApp from './ui/academy.mjs'
    createRoot(document.getElementById('root')).render(createElement(AcademyApp))
  </script>
</body>
</html>
